<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ИСМПУ PID Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
      --text:#e6edf3; --muted:#8b949e; --blue:#58a6ff; --orange:#f0883e;
      --green:#3fb950; --red:#f85149; --purple:#bc8cff; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg);
      color:var(--text); font:14px/1.4 system-ui,sans-serif }
    header { position:sticky; top:0; z-index:2; padding:12px 18px;
      background:#010409; border-bottom:1px solid var(--line) }
    #status { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted) }
    #status strong { color:var(--text) }
    nav { display:flex; gap:6px; overflow:auto; padding:10px 18px;
      border-bottom:1px solid var(--line) }
    button { color:var(--text); background:var(--panel); border:1px solid var(--line);
      border-radius:6px; padding:7px 11px; cursor:pointer }
    button.active { border-color:var(--blue); color:var(--blue) }
    button:disabled { opacity:.45; cursor:not-allowed }
    main { padding:16px 18px; display:grid; grid-template-columns:minmax(0,3fr) minmax(260px,1fr); gap:14px }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px }
    canvas { width:100%; height:440px; display:block }
    .metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
    .metric { padding:8px; background:#0d1117; border-radius:6px }
    .metric span { display:block; color:var(--muted); font-size:12px }
    .metric b { font:600 17px ui-monospace,monospace }
    form { margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
    label { color:var(--muted); font-size:12px } input { width:100%; margin-top:3px;
      padding:7px; color:var(--text); background:#0d1117; border:1px solid var(--line); border-radius:5px }
    .actions { grid-column:1/-1; display:flex; gap:8px }
    #timeline { max-height:180px; overflow:auto; color:var(--muted); font:12px ui-monospace,monospace }
    .legend { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; color:var(--muted) }
    .swatch { width:10px; height:10px; display:inline-block; border-radius:50%; margin-right:4px }
    @media (max-width:850px) { main { grid-template-columns:1fr } canvas { height:330px } }
  </style>
</head>
<body>
  <header>
    <div id="status">Loading…</div>
  </header>
  <nav id="tabs"></nav>
  <main>
    <section>
      <div class="legend">
        <span><i class="swatch" style="background:#58a6ff"></i>value</span>
        <span><i class="swatch" style="background:#f0883e"></i>setpoint</span>
        <span><i class="swatch" style="background:#3fb950"></i>output</span>
        <span><i class="swatch" style="background:#bc8cff"></i>P/I/D</span>
      </div>
      <canvas id="plot"></canvas>
    </section>
    <aside>
      <section>
        <h3 id="view-title">PID</h3>
        <div class="metric-grid" id="metrics"></div>
        <form id="gains">
          <label>Kp<input name="kp" type="number" step="any"></label>
          <label>Ki<input name="ki" type="number" step="any"></label>
          <label>Kd<input name="kd" type="number" step="any"></label>
          <div class="actions">
            <button id="apply" type="submit">Apply gains</button>
            <button id="export" type="button">Export snapshot</button>
          </div>
        </form>
      </section>
      <section style="margin-top:14px">
        <h3>Timeline</h3>
        <div id="timeline"></div>
      </section>
    </aside>
  </main>
<script>
let state=null, active='roll';
const colors={value:'#58a6ff',setpoint:'#f0883e',output:'#3fb950',p:'#bc8cff',i:'#d2a8ff',d:'#ff7b72'};
const fmt=v => (v===null || v===undefined || Number.isNaN(Number(v))) ? '—' : Number(v).toFixed(4);
async function refresh(){
  state=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());
  const h=state.header, replay=state.replay;
  document.querySelector('#status').innerHTML=[
    ['backend',h.backend],['aircraft',h.aircraft_profile],['scenario',h.scenario],
    ['segment',h.segment],['ILS',h.ils_valid],['go-around',h.go_around||'no'],
    ['mode',replay?'replay':(h.tune_enabled?'TUNING':'monitor-only')]
  ].map(x=>`<span>${x[0]}: <strong>${x[1]??'—'}</strong></span>`).join('');
  buildTabs(); render();
}
function buildTabs(){
  const tabs=document.querySelector('#tabs');
  tabs.innerHTML=state.views.map(v=>`<button data-key="${v.key}" class="${v.key===active?'active':''}">${v.label}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.key;buildTabs();render()});
}
function render(){
  const view=state.views.find(v=>v.key===active), p=view.latest||{};
  document.querySelector('#view-title').textContent=`${view.label} · ${p.segment||'—'}`;
  document.querySelector('#metrics').innerHTML=['value','setpoint','error','output','p','i','d','saturated']
    .map(k=>`<div class="metric"><span>${k}</span><b>${k==='saturated'?(p[k]?'YES':'no'):fmt(p[k])}</b></div>`).join('');
  ['kp','ki','kd'].forEach(k=>document.querySelector(`[name=${k}]`).value=p[k]??'');
  document.querySelector('#apply').disabled=view.locked;
  document.querySelector('#gains').dataset.pid=view.pid_key;
  document.querySelector('#timeline').innerHTML=state.timeline.slice().reverse()
    .map(e=>`<div>${fmt(e.time_s)}s · ${e.event}: ${JSON.stringify(e.value)}</div>`).join('')||'No events';
  draw(view.points);
}
function draw(points){
  const c=document.querySelector('#plot'), dpr=devicePixelRatio||1, box=c.getBoundingClientRect();
  c.width=Math.max(1,box.width*dpr); c.height=Math.max(1,box.height*dpr);
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,box.width,box.height);
  x.strokeStyle='#30363d'; x.lineWidth=1;
  for(let i=0;i<=5;i++){let y=20+i*(box.height-40)/5;x.beginPath();x.moveTo(45,y);x.lineTo(box.width-10,y);x.stroke()}
  const keys=['value','setpoint','output','p','i','d'], vals=[];
  points.forEach(p=>keys.forEach(k=>{if(Number.isFinite(Number(p[k]))) vals.push(Number(p[k]))}));
  if(!vals.length)return; let lo=Math.min(...vals),hi=Math.max(...vals); if(lo===hi){lo-=1;hi+=1}
  const t0=Number(points[0].time_s)||0,t1=Number(points.at(-1).time_s)||t0+1;
  keys.forEach(k=>{x.strokeStyle=colors[k];x.lineWidth=k==='value'||k==='setpoint'?2:1;x.beginPath();let begun=false;
    points.forEach(p=>{let v=Number(p[k]);if(!Number.isFinite(v))return;let px=45+(Number(p.time_s)-t0)/(t1-t0||1)*(box.width-55),py=20+(hi-v)/(hi-lo)*(box.height-40);
      begun?x.lineTo(px,py):(x.moveTo(px,py),begun=true)});x.stroke()});
}
document.querySelector('#gains').onsubmit=async e=>{
  e.preventDefault();const payload=Object.fromEntries(new FormData(e.target).entries());
  const r=await fetch('/api/gains/'+e.target.dataset.pid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok)alert((await r.json()).error);await refresh();
};
document.querySelector('#export').onclick=async()=>{
  const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"label":"dashboard"}'});
  const body=await r.json();alert(r.ok?'Saved: '+body.path:body.error);
};
addEventListener('resize',()=>state&&render());setInterval(refresh,500);refresh();
</script>
</body>
</html>
