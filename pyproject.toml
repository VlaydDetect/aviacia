[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ismpu"
version = "0.0.1"
description = "Интеллектуальная система многопараметрического управления ВС на посадке и пробеге по ВПП"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "termcolor>=2.0",
]

[project.optional-dependencies]
# PyTorch нужен только офлайн-обучению и SFT inference; runtime classical его не импортирует.
sft = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["ismpu*"]

[tool.setuptools.package-data]
"ismpu.config" = ["*.json"]
"ismpu.working_ics" = ["*.json", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
